# docker compose up --build
# API docs: http://localhost:8000/docs    UI: http://localhost:8501
services:
  api:
    build: .
    image: university-knowledge-assistant:latest
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      API_HOST: "0.0.0.0"
    volumes:
      - ./documents:/app/documents
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 3
    restart: unless-stopped

  ui:
    build: .
    image: university-knowledge-assistant:latest
    command: ["streamlit", "run", "app/ui.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
